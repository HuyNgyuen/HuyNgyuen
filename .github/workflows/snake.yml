name: Generate Snake

on:
  # Tự động chạy mỗi 12 tiếng
  schedule:
    - cron: "0 */12 * * *" 
  
  # Cho phép anh chủ động bấm chạy bằng tay bất cứ lúc nào
  workflow_dispatch:
  
  # Chạy mỗi khi anh có commit mới ở nhánh chính
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Tạo ra hoạt ảnh chú rắn từ contribution graph của HuyNgyuen
      - name: generate github-contribution-grid-snake.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: HuyNgyuen
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Đẩy file ảnh động đã tạo vào một nhánh ẩn tên là "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
